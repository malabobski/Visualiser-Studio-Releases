name: Finish Visualiser Studio 1.2.9 release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-1.2.9
  cancel-in-progress: false
jobs:
  mac:
    name: Verify and upload Mac ${{ matrix.arch }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: malabobski/Visualiser-Studio
          ref: 5ff0e6f98e584c49cf014b953f422b32b609c7b5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - name: Check Mac scripting syntax
        run: |
          osacompile -l JavaScript -o "$RUNNER_TEMP/mac-media.scpt" mac-media.jxa
          osacompile -o "$RUNNER_TEMP/mac-music-art.scpt" mac-music-art.applescript
      - name: Build the native release
        run: node build/mac-build.cjs --release
      - name: Verify packaged app, signature and native libraries
        run: node build/verify-mac.cjs --release
      - name: Upload verified Mac installers to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.2.9 dist/mac-release/*.dmg dist/mac-release/*.zip --repo malabobski/Visualiser-Studio-Releases --clobber
  publish:
    name: Publish only when Windows and both Macs are ready
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='malabobski',repo='Visualiser-Studio-Releases';
            const {data:release}=await github.rest.repos.getReleaseByTag({owner,repo,tag:'v1.2.9'});
            const {data:assets}=await github.rest.repos.listReleaseAssets({owner,repo,release_id:release.id,per_page:100});
            const required=['Visualiser-Studio-Setup-1.2.9.exe','Visualiser-Studio-Setup-1.2.9.exe.blockmap','latest.yml','Visualiser-Studio-1.2.9-mac-arm64.dmg','Visualiser-Studio-1.2.9-mac-arm64.zip','Visualiser-Studio-1.2.9-mac-x64.dmg','Visualiser-Studio-1.2.9-mac-x64.zip'];
            for(const name of required){const asset=assets.find(a=>a.name===name);if(!asset||asset.state!=='uploaded'||!asset.size)throw Error('Missing verified asset '+name);}
            if(assets.some(a=>a.name==='latest-mac.yml'))throw Error('Manual Mac build must not advertise automatic installation');
            if(release.draft)await github.rest.repos.updateRelease({owner,repo,release_id:release.id,draft:false,prerelease:false,make_latest:'true'});
            core.info('Published https://github.com/'+owner+'/'+repo+'/releases/tag/v1.2.9');
