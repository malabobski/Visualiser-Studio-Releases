name: Finish Visualiser Studio 1.2.9 release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-1.2.9
  cancel-in-progress: false
jobs:
  publish:
    name: Publish verified Windows and Mac 1.2.9 installers
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify successful builds and publish the existing draft
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const base='https://api.github.com/repos/malabobski/Visualiser-Studio-Releases';
            const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
            async function api(route,options={}){const r=await fetch(base+route,{...options,headers:{...headers,...options.headers}});if(!r.ok)throw Error('GitHub HTTP '+r.status+' at '+route);return r.json();}
            const jobs=await api('/actions/runs/39284726729/jobs?per_page=100');
            const mac=jobs.jobs.filter(j=>j.name.startsWith('Verify and upload Mac '));
            if(mac.length!==2||mac.some(j=>j.conclusion!=='success'))throw Error('Both native Mac verification jobs must pass first');
            const release=await api('/releases/417492516');
            if(release.tag_name!=='v1.2.9')throw Error('Wrong release');
            const assets=await api('/releases/417492516/assets?per_page=100');
            const required=['Visualiser-Studio-Setup-1.2.9.exe','Visualiser-Studio-Setup-1.2.9.exe.blockmap','latest.yml','Visualiser-Studio-1.2.9-mac-arm64.dmg','Visualiser-Studio-1.2.9-mac-arm64.zip','Visualiser-Studio-1.2.9-mac-x64.dmg','Visualiser-Studio-1.2.9-mac-x64.zip'];
            for(const name of required){const a=assets.find(a=>a.name===name);if(!a||a.state!=='uploaded'||!a.size)throw Error('Missing verified asset '+name);}
            if(assets.some(a=>a.name==='latest-mac.yml'))throw Error('Manual Mac build must not advertise automatic installation');
            if(release.draft)await api('/releases/417492516',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({draft:false,prerelease:false,make_latest:'true'})});
            console.log('Published https://github.com/malabobski/Visualiser-Studio-Releases/releases/tag/v1.2.9');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
